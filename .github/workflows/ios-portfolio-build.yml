name: iOS Portfolio Build

on:
  push:
    branches: ["claude/confident-dirac-ZPGOG", "main"]
    paths:
      - "my portfolio/iOS/**"
  pull_request:
    paths:
      - "my portfolio/iOS/**"
  workflow_dispatch:

jobs:
  build:
    name: xcodebuild (iOS 16 Simulator)
    runs-on: macos-14          # Xcode 15 pre-installed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (no signing)
        working-directory: "my portfolio/iOS"
        run: |
          set -o pipefail
          xcodebuild build \
            -project MyPortfolio.xcodeproj \
            -scheme MyPortfolio \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color --simple
