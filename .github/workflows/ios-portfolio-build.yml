name: iOS Portfolio Build

on:
  push:
    branches: ["claude/confident-dirac-ZPGOG", "main"]
    paths:
      - "my portfolio/iOS/**"
      - ".github/workflows/ios-portfolio-build.yml"
  pull_request:
    paths:
      - "my portfolio/iOS/**"
      - ".github/workflows/ios-portfolio-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: xcodebuild (iOS 16 Simulator)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: List available simulators
        run: xcrun simctl list devices available --json | python3 -c "
import json, sys
d = json.load(sys.stdin)['devices']
for runtime, devs in d.items():
    for dev in devs:
        if 'iPhone' in dev['name']:
            print(runtime, dev['name'])
" | head -20

      - name: Build (no signing)
        working-directory: "my portfolio/iOS"
        run: |
          set -o pipefail
          xcodebuild build \
            -project MyPortfolio.xcodeproj \
            -scheme MyPortfolio \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | xcpretty --color --simple
